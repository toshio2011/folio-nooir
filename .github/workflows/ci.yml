name: CI (build)

on:
  push:
    branches: [master]
  pull_request:
    # The legacy FreeInk SDK gitlink used by this firmware CI is unavailable.
    # Skip this workflow only for PRs whose changed paths are all web-emulator
    # code, packaging, attribution, or documentation. Any firmware source,
    # PlatformIO configuration, test, or submodule change remains unignored
    # and therefore runs the normal firmware CI with its real result visible.
    paths-ignore:
      - '.github/workflows/ci.yml'
      - '.github/workflows/nooir-web-emulator-pages.yml'
      - 'web-emulator/**'
      - 'scripts/check_nooir_web_package.py'
      - 'scripts/nooir_browser_smoke.mjs'
      - 'scripts/package_nooir_web_emulator.py'
      - 'scripts/prepare_esp32c3_rom.py'
      - 'scripts/prepare_nooir_softfloat_source.py'
      - 'scripts/prepare_nooir_browser_smoke_diagnostics.py'
      - 'scripts/prepare_nooir_browser_acceptance_evidence.py'
      - 'scripts/select_cdp_page_target.mjs'
      - 'scripts/serve_nooir_web_emulator.py'
      - 'scripts/smoke_nooir_shared_firmware.py'
      - 'scripts/verify_nooir_screenshot_download.mjs'
      - 'scripts/requirements.txt'
      - 'test/node/**'
      - 'test/python/test_web_emulator_contract.py'
      - 'LICENSES/CORRESPONDING-SOURCE.md'
      - 'LICENSES/EINK-QEMU-WEB-BUNDLE.md'
      - 'LICENSES/ESP32C3-ROM-APACHE-2.0.txt'
      - 'LICENSES/ESP32C3-ROM-BSD-3-CLAUSE.txt'
      - 'LICENSES/ESP32C3-ROM-ELF-README.md'
      - 'LICENSES/ESP32C3-ROM-ESP-IDF-COPYRIGHT.rst'
      - 'LICENSES/ESP32C3-ROM-NEWLIB-COPYING.NEWLIB'
      - 'LICENSES/ESP32C3-ROM-NOTICES.md'
      - 'LICENSES/REFERENCE-PROJECTS.md'
      - 'LICENSES/SPDX-CC0-1.0.txt'
      - 'LICENSES/eink-qemu-components/**'
      - 'ROADMAP.md'
      - 'README.md'
      - 'HANDOFF.md'
      - 'docs/web-emulator-pr-draft.md'
      - 'docs/web-emulator-readiness.md'
      - 'docs/web-emulator-release-readiness-2026-11-04.md'

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Run cppcheck
        run: pio check --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build CrossPoint
        # Both envs in ONE pio invocation: a second `pio run` can wipe the whole
        # .pio/build tree (project-checksum mismatch after the S3 toolchain
        # installs into the restored cache), deleting the default firmware.bin
        # before the artifact upload.
        run: |
          set -euo pipefail
          pio run -e default -e sticky | tee pio.log

      - name: Extract firmware stats

        run: |
          set -euo pipefail
          ram_line="$(grep -E "RAM:\\s" -m1 pio.log || true)"
          flash_line="$(grep -E "Flash:\\s" -m1 pio.log || true)"
          echo "ram_line=${ram_line}" >> "$GITHUB_OUTPUT"
          echo "flash_line=${flash_line}" >> "$GITHUB_OUTPUT"
          {
            echo "## Firmware build stats"
            if [ -n "$ram_line" ]; then echo "- ${ram_line}"; else echo "- RAM: not found"; fi
            if [ -n "$flash_line" ]; then echo "- ${flash_line}"; else echo "- Flash: not found"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware.bin artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware.bin
          path: .pio/build/default/firmware.bin
          if-no-files-found: error

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build
      - clang-format
      - cppcheck
      - unit-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
