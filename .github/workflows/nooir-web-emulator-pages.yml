name: Nooir web emulator (build only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'web-emulator/**'
      - 'scripts/package_nooir_web_emulator.py'
      - 'scripts/check_nooir_web_package.py'
      - 'scripts/prepare_esp32c3_rom.py'
      - 'scripts/prepare_nooir_softfloat_source.py'
      - 'scripts/smoke_nooir_shared_firmware.py'
      - 'LICENSES/**'
      - '.github/workflows/nooir-web-emulator-pages.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EINK_QEMU_REVISION: d1b24a5fbc1bbae7ea31075460f63cd4c989c1dc
      EMSDK_VERSION: '6.0.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the pinned emulator engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: serialx/eink-qemu
          ref: d1b24a5fbc1bbae7ea31075460f63cd4c989c1dc
          path: work/eink-qemu
          persist-credentials: false

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libltdl-dev \
            pkg-config ninja-build meson python3-venv texinfo gettext \
            dosfstools mtools cmake openssl curl binutils-riscv64-unknown-elf

      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1

      - name: Verify engine pin and test browser modules
        working-directory: work/eink-qemu
        run: |
          test "$(git rev-parse HEAD)" = "$EINK_QEMU_REVISION"
          node --test eink-qemu/wasm/web/*.test.mjs eink-qemu/tests/*.mjs
          python3 -m unittest eink-qemu.tests.test_mksd
          python3 -m unittest eink-qemu.tests.test_panel_launchers eink-qemu.tests.test_wifi_launchers
          python3 -m unittest discover -s eink-qemu/wasm -p test_wifi_assets.py
          cd "$GITHUB_WORKSPACE"
          node --test test/node/cdp-target-selection.test.mjs test/node/sd-asset-location.test.mjs
          python3 test/python/test_web_emulator_contract.py

      - name: Build pinned engine dependencies
        working-directory: work/eink-qemu
        env:
          WIFI_ASSETS: none
        run: eink-qemu/wasm/build-deps.sh

      - name: Build pinned engine without optional font downloads
        working-directory: work/eink-qemu
        env:
          WIFI_ASSETS: none
        run: eink-qemu/wasm/build.sh --web

      - name: Install the pinned ROM ELF parser
        run: |
          python3 -m venv "$RUNNER_TEMP/nooir-rom-venv"
          "$RUNNER_TEMP/nooir-rom-venv/bin/python" -m pip install --disable-pip-version-check pyelftools==0.33

      - name: Prepare the hash-verified licensed ESP32-C3 ROM
        run: |
          "$RUNNER_TEMP/nooir-rom-venv/bin/python" scripts/prepare_esp32c3_rom.py \
            --output build/esp32c3-rom.bin \
            --objcopy riscv64-unknown-elf-objcopy \
            --experimental-licensed-elf-startup

      - name: Download the exact public v1.6.6 image for ephemeral emulator smoke tests
        run: |
          firmware="$RUNNER_TEMP/folio-nooir-v1.6.6-firmware.bin"
          curl --fail --location --retry 3 \
            https://github.com/toshio2011/folio-nooir/releases/download/1.6.6/firmware.bin \
            --output "$firmware"
          echo 'badcd6fb6cb4b5323f92714e893f9c488e887aa8f7b5d8e28cd0e6639aeae108  '"$firmware" | sha256sum --check --status

      - name: Smoke the licensed C3 ROM with the unchanged X3/X4 firmware
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          rom = Path('build/esp32c3-rom.bin').read_bytes()
          target = Path('work/eink-qemu/pc-bios/esp32c3-rom.bin')
          original = target.read_bytes()
          expected = '0de1e65020e803bea0d7443dca149d61895e01fca3bb9c82d073234eebd73f99'
          actual = hashlib.sha256(original).hexdigest()
          if actual != expected:
              raise SystemExit(f'Pinned QEMU C3 ROM source hash changed: {actual}')
          target.write_bytes(rom)
          PY
          smoke_log="$RUNNER_TEMP/nooir-smoke-console.log"
          set +e
          python3 scripts/smoke_nooir_shared_firmware.py \
            --engine-source work/eink-qemu \
            --firmware "$RUNNER_TEMP/folio-nooir-v1.6.6-firmware.bin" > "$smoke_log" 2>&1
          smoke_status=$?
          set -e
          if [ "$smoke_status" -ne 0 ]; then
            grep -E '^(x3|x4): FAIL|^FAIL:' "$smoke_log" || true
            echo 'Detailed emulator output remains on the temporary runner.'
            exit "$smoke_status"
          fi
          grep -E '^(x3|x4): PASS|^PASS:' "$smoke_log"

      - name: Preserve the exact SoftFloat corresponding source
        run: |
          python3 scripts/prepare_nooir_softfloat_source.py \
            --engine-source work/eink-qemu \
            --output work/eink-qemu/build-wasm-32limit/nooir-corresponding-source/berkeley-softfloat-3

      - name: Package Nooir shell and audit licenses and firmware exclusions
        id: package_audit
        run: |
          python3 scripts/package_nooir_web_emulator.py \
            --engine-source work/eink-qemu \
            --engine-dist work/eink-qemu/build-wasm-32limit/web-dist \
            --esp32c3-rom build/esp32c3-rom.bin \
            --emsdk-root "$EMSDK" \
            --output build/nooir-web-emulator
          python3 scripts/check_nooir_web_package.py build/nooir-web-emulator

      - name: Smoke the audited package in Chrome on X3 and X4
        id: browser_smoke
        run: |
          set -euo pipefail
          google-chrome --version
          mkdir -p build/nooir-browser-smoke build/nooir-browser-evidence
          cp -a build/nooir-web-emulator/. build/nooir-browser-smoke/
          for device in x3 x4; do
            sd="build/nooir-test-${device}.img"
            python3 work/eink-qemu/eink-qemu/mksd.py "$sd" 64 --cluster-size 512
            mmd -i "${sd}@@1048576" ::/books
            cp "$sd" "build/nooir-browser-smoke/engine/nooir-test-${device}.img"
          done

          preview_log="$RUNNER_TEMP/nooir-preview.log"
          chrome_log="$RUNNER_TEMP/nooir-chrome.log"
          chrome_profile="$RUNNER_TEMP/nooir-chrome-profile"
          diagnostics_dir="build/nooir-browser-startup-diagnostics"

          python3 scripts/serve_nooir_web_emulator.py \
            --directory build/nooir-browser-smoke --host 127.0.0.1 --port 8178 \
            > "$preview_log" 2>&1 &
          server_pid=$!
          for _ in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:8178/ >/dev/null; then break; fi
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:8178/ >/dev/null

          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --disable-gpu --no-first-run --no-default-browser-check \
            --remote-debugging-port=9224 \
            --user-data-dir="$chrome_profile" \
            http://127.0.0.1:8178/ > "$chrome_log" 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" "$server_pid" 2>/dev/null || true' EXIT

          cdp_ready=0
          chrome_exit_status=not-observed
          for _ in $(seq 1 60); do
            if curl --fail --silent --connect-timeout 0.5 --max-time 0.5 http://127.0.0.1:9224/json/list >/dev/null; then
              cdp_ready=1
              break
            fi
            if ! kill -0 "$chrome_pid" 2>/dev/null; then
              if wait "$chrome_pid"; then chrome_exit_status=0; else chrome_exit_status=$?; fi
              echo "Chrome exited before CDP became ready (exit=$chrome_exit_status); ending readiness poll."
              break
            fi
            sleep 0.5
          done

          if [ "$cdp_ready" -ne 1 ]; then
            mkdir -p "$diagnostics_dir" || true
            set +e
            {
              echo "Chrome version: $(google-chrome --version 2>&1 | head -n 1)"
              echo "Chrome PID: $chrome_pid"
              if kill -0 "$chrome_pid" 2>/dev/null; then
                echo "Chrome process: alive"
                ps -p "$chrome_pid" -o pid=,ppid=,stat=,etime= 2>/dev/null || true
              else
                if [ "$chrome_exit_status" = "not-observed" ]; then
                  if wait "$chrome_pid"; then chrome_exit_status=0; else chrome_exit_status=$?; fi
                fi
                echo "Chrome process: exited; wait status=$chrome_exit_status"
              fi
              echo "Launch sandbox flag: --no-sandbox"
              if [ -d "$chrome_profile" ]; then
                stat -c 'Chrome profile permissions=%a owner_uid=%u owner_gid=%g' "$chrome_profile" 2>/dev/null || true
                if [ -w "$chrome_profile" ]; then echo "Chrome profile writable=yes"; else echo "Chrome profile writable=no"; fi
              else
                echo "Chrome profile: not created"
              fi
              if [ -s "$chrome_profile/DevToolsActivePort" ]; then
                active_port="$(head -n 1 "$chrome_profile/DevToolsActivePort" | grep -E '^[0-9]{1,5}$' || true)"
                if [ -n "$active_port" ]; then echo "DevToolsActivePort: present; port=$active_port"; else echo "DevToolsActivePort: present; port unreadable"; fi
              else
                echo "DevToolsActivePort: absent"
              fi
              echo "Runner uid=$(id -u 2>/dev/null || echo unavailable), gid=$(id -g 2>/dev/null || echo unavailable)"
              if [ -w "$RUNNER_TEMP" ]; then echo "Runner temp writable=yes"; else echo "Runner temp writable=no"; fi
              if printenv DISPLAY >/dev/null 2>&1; then echo "DISPLAY=set (value omitted)"; else echo "DISPLAY=unset"; fi
              if [ -d /dev/shm ]; then df -Pk /dev/shm 2>/dev/null | tail -n 1; else echo "/dev/shm missing"; fi
              if [ -x /opt/google/chrome/chrome ] && command -v ldd >/dev/null 2>&1; then
                missing_dependencies="$(ldd /opt/google/chrome/chrome 2>&1 | grep 'not found' || true)"
                if [ -n "$missing_dependencies" ]; then printf 'Chrome missing runtime libraries:\n%s\n' "$missing_dependencies"; else echo "Chrome missing runtime libraries: none reported"; fi
              else
                echo "Chrome runtime dependency check unavailable"
              fi
              listeners="$(ss -Hlt 'sport = :9224' 2>&1 || true)"
              if [ -n "$listeners" ]; then printf 'Port 9224 listener: %s\n' "$listeners"; else echo "Port 9224 listener: none"; fi
              for endpoint in version list; do
                response="$RUNNER_TEMP/nooir-cdp-$endpoint.json"
                http_status=000
                if http_status="$(curl --silent --max-time 3 --output "$response" --write-out '%{http_code}' "http://127.0.0.1:9224/json/$endpoint" 2>/dev/null)"; then
                  curl_status=0
                else
                  curl_status=$?
                fi
                echo "CDP /json/$endpoint: curl_exit=$curl_status http_status=$http_status"
                if [ "$curl_status" -eq 0 ]; then
                  python3 - "$endpoint" "$response" <<'PY'
          import json, sys
          from pathlib import Path

          endpoint, filename = sys.argv[1:]
          try:
              payload = json.loads(Path(filename).read_text(encoding="utf-8"))
          except Exception as error:
              print("response_json=invalid (" + type(error).__name__ + ")")
              raise SystemExit(0)
          if endpoint == "version" and isinstance(payload, dict):
              print("Browser=" + str(payload.get("Browser", "unavailable"))[:80])
              print("Protocol-Version=" + str(payload.get("Protocol-Version", "unavailable"))[:40])
          elif endpoint == "list" and isinstance(payload, list):
              types = sorted({str(item.get("type", "unknown")) for item in payload if isinstance(item, dict)})
              print("targets=" + str(len(payload)) + " types=" + ",".join(types))
          else:
              print("response_json=unexpected-shape")
          PY
                fi
              done
            } | tee "$diagnostics_dir/summary.txt"

            for label in chrome preview; do
              if [ "$label" = "chrome" ]; then source_log="$chrome_log"; else source_log="$preview_log"; fi
              python3 - "$source_log" "$diagnostics_dir/$label.log" <<'PY'
          from collections import deque
          from pathlib import Path
          import re, sys

          source, target = map(Path, sys.argv[1:3])
          rules = [
              (re.compile(r"(?im)^\s*(authorization|proxy-authorization)\s*:\s*.*$"), lambda m: m.group(1) + ": [redacted]"),
              (re.compile(r"(?i)\bbearer\s+[A-Za-z0-9._~+/=-]+"), lambda m: "Bearer [redacted]"),
              (re.compile(r"(?i)\b(token|access[_-]?token|secret|password|credential|api[_-]?key)\s*[=:]\s*[^,\s&]+"), lambda m: m.group(1) + "=[redacted]"),
              (re.compile(r"\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})\b"), lambda m: "[redacted token]"),
              (re.compile(r"(?i)wss?://(?:127\.0\.0\.1|localhost):\d+/devtools/[^\s]+"), lambda m: "[redacted CDP URL]"),
              (re.compile(r'''(?i)[^\s"'<>]*\.(?:bin|rom|elf)\b'''), lambda m: "[redacted binary path]"),
              (re.compile(r"""(?i)--user-data-dir(?:=|\s+)[^\s"'<>]+"""), lambda m: "--user-data-dir=[redacted browser profile]"),
              (re.compile(r"""(?i)(?:[A-Za-z]:\\Users\\[^"'<>]*|/(?:home|root|Users|tmp|mnt)/[^\s"'<>]*)"""), lambda m: "[redacted local path]"),
          ]
          lines = deque(maxlen=80)
          if source.is_file():
              with source.open("r", encoding="utf-8", errors="replace") as stream:
                  lines.extend(stream)
          else:
              lines.append("[log file missing]")
          with target.open("w", encoding="utf-8") as output:
              for line in lines:
                  for pattern, replacement in rules:
                      line = pattern.sub(replacement, line)
                  output.write(line[:1600] + (" [truncated]\n" if len(line) > 1600 else ""))
          PY
              echo "--- $label log tail: max 80 lines, redacted ---"
              cat "$diagnostics_dir/$label.log"
            done
            echo "Failure artifact contains only summary and redacted text logs; no environment dump, profile, firmware, ROM, package, or raw CDP response."
            exit 1
          fi
          echo "Chrome CDP /json/list became ready."
          browser_smoke_failed=0
          diagnostics_dir="build/nooir-browser-smoke-diagnostics"
          mkdir -p "$diagnostics_dir"
          for device in x3 x4; do
            sd="build/nooir-test-$device.img"
            smoke_log="$RUNNER_TEMP/nooir-browser-$device.log"
            smoke_status=0
            NOOIR_BUTTON_HOLD_MS=170 \
            NOOIR_INPUT_PROBE_KEY=Left \
            NOOIR_SD_ASSET="nooir-test-$device.img" \
            CDP_PORT=9224 \
              node scripts/nooir_browser_smoke.mjs \
                http://127.0.0.1:8178/ "$device" \
                "$RUNNER_TEMP/folio-nooir-v1.6.6-firmware.bin" \
                "$sd" \
                "build/nooir-browser-evidence/$device" \
                > "$smoke_log" 2>&1 || smoke_status=$?

            if [ "$smoke_status" -eq 0 ]; then
              if python3 - "build/nooir-browser-evidence/$device/result.json" >> "$smoke_log" 2>&1 <<'PY'
          import json, sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text())
          action = result["actions"][-1]
          print(
              f"{result['device']}: {result['result']}; "
              f"button={action['key']} held_ms={action['heldMs']} "
              f"screen_change={action.get('screenDifference', {}).get('differentFraction', 'activity')}"
          )
          PY
              then
                echo "$device: PASS"
              else
                smoke_status=$?
              fi
            fi

            if [ "$smoke_status" -ne 0 ]; then
              browser_smoke_failed=1
              echo "$device: FAIL (smoke/summary exit=$smoke_status)"
            fi

            if ! python3 scripts/prepare_nooir_browser_smoke_diagnostics.py \
              --device "$device" --exit-status "$smoke_status" \
              --log "$smoke_log" --output-dir "$diagnostics_dir"; then
              echo "$device: diagnostic collection failed; continuing to the other profile."
              browser_smoke_failed=1
            fi
          done

          if [ "$browser_smoke_failed" -ne 0 ]; then
            echo "X3/X4 browser smoke failed; see the separate failure-only diagnostics artifact."
            exit 1
          fi

      - name: Upload X3/X4 browser smoke diagnostics (failure only)
        if: failure() && steps.browser_smoke.outcome == 'failure' && hashFiles('build/nooir-browser-smoke-diagnostics/**') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nooir-browser-smoke-diagnostics
          path: build/nooir-browser-smoke-diagnostics/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload Chrome startup diagnostics (failure only)
        if: failure() && hashFiles('build/nooir-browser-startup-diagnostics/**') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nooir-chrome-startup-diagnostics
          path: build/nooir-browser-startup-diagnostics/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload review build (no reader firmware)
        if: always() && steps.package_audit.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nooir-web-emulator-review
          path: build/nooir-web-emulator
          if-no-files-found: error
          retention-days: 7

  # Deployment stays impossible until this workflow is changed after explicit approval.
  deploy-pages:
    if: ${{ false }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - run: echo 'Deployment is intentionally disabled.'
