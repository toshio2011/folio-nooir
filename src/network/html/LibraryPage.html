<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Folio Nooir Library</title>
  <style>
    :root{--ink:#1d1b1a;--paper:#f3eee4;--card:#fffaf0;--muted:#756d63;--accent:#7b4635;--line:#d8cdbd}
    @media(prefers-color-scheme:dark){:root{--ink:#eee8dd;--paper:#181614;--card:#24201c;--muted:#b8ada0;--accent:#d39a78;--line:#4a423a}}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
    header{max-width:1100px;margin:auto;padding:32px 22px 18px;border-bottom:1px solid var(--line)}
    h1{margin:0;font-size:clamp(2rem,7vw,4.5rem);font-weight:500;letter-spacing:-.04em}.noo{color:var(--accent)}
    nav{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap}a{color:var(--ink);text-decoration:none}nav a.active{color:var(--accent);border-bottom:2px solid}
    main{max-width:1100px;margin:auto;padding:24px 22px 60px}.summary{display:flex;gap:24px;color:var(--muted);margin-bottom:24px;flex-wrap:wrap}
    .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 20px}.book{min-width:0}
    .cover{aspect-ratio:2/3;background:linear-gradient(145deg,var(--accent),#2d2723);box-shadow:5px 7px 0 rgba(0,0,0,.14);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:14px;color:white;text-align:center}
    .cover img{width:100%;height:100%;object-fit:cover}.title{font-weight:700;margin:14px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.author,.meta{color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bar{height:4px;background:var(--line);margin-top:10px}.fill{height:100%;background:var(--accent)}.empty{color:var(--muted);padding:50px 0}
  </style>
</head>
<body>
  <header><h1>Folio <span class="noo">Nooir</span></h1><nav><a href="/">Device</a><a class="active" href="/library">Bookshelf</a><a href="/stats">Reading Stats</a><a href="/todo">To-Do List</a><a href="/files">Transfer</a><a href="/settings">Settings</a><a href="/fonts">Typography</a></nav></header>
  <main><div class="summary" id="summary">Loading library…</div><section class="shelf" id="shelf"></section></main>
  <script>
    const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const duration=s=>s<60?`${s}s`:s<3600?`${Math.floor(s/60)}m`:`${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`;
    fetch('/api/library').then(r=>r.json()).then(({books})=>{
      const seconds=books.reduce((n,b)=>n+b.seconds,0),sessions=books.reduce((n,b)=>n+b.sessions,0);
      document.getElementById('summary').innerHTML=`<span>${books.length} books</span><span>${duration(seconds)} read</span><span>${sessions} sessions</span>`;
      const shelf=document.getElementById('shelf');
      if(!books.length){shelf.innerHTML='<div class="empty">Open a book on your Xteink to begin the shelf.</div>';return}
      shelf.innerHTML=books.map(b=>`<article class="book"><div class="cover">${b.hasCover?`<img loading="lazy" src="/api/library/cover?index=${b.index}" alt=""/>`:`<span>${esc(b.title)}</span>`}</div><div class="title" title="${esc(b.title)}">${esc(b.title)||'Untitled'}</div><div class="author">${esc(b.author)||'Unknown author'}</div><div class="bar"><div class="fill" style="width:${b.progress}%"></div></div><div class="meta">${b.progress===100?'Complete':b.progress?'Ongoing':'New'} · ${b.progress}% · ${duration(b.seconds)}</div></article>`).join('');
    }).catch(()=>document.getElementById('summary').textContent='Could not load the library.');
  </script>
</body>
</html>
