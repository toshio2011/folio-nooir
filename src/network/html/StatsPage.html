<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Folio Nooir Reading Statistics</title>
  <style>
    :root{--ink:#1d1b1a;--paper:#f3eee4;--card:#fffaf0;--muted:#756d63;--accent:#7b4635;--line:#d8cdbd}
    @media(prefers-color-scheme:dark){:root{--ink:#eee8dd;--paper:#181614;--card:#24201c;--muted:#b8ada0;--accent:#d39a78;--line:#4a423a}}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
    header{max-width:1100px;margin:auto;padding:32px 22px 18px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:clamp(2rem,7vw,4.5rem);font-weight:500;letter-spacing:-.04em}.noo{color:var(--accent)}
    nav{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap}a{color:var(--ink);text-decoration:none}nav a.active{color:var(--accent);border-bottom:2px solid}
    main{max-width:1100px;margin:auto;padding:24px 22px 60px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px}.card{background:var(--card);border:1px solid var(--line);padding:16px}.label{color:var(--muted);font-size:.85rem}.value{font-size:1.6rem;margin-top:5px}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0 32px}.day{min-height:54px;border:1px solid var(--line);padding:6px;font-size:.75rem;background:var(--card)}.day.read{background:var(--accent);color:white}.day small{display:block;opacity:.75}
    .toolbar{display:flex;gap:10px;align-items:center;margin:-8px 0 20px}.button,button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;text-decoration:none;cursor:pointer}.button:hover,button:hover{border-color:var(--accent);color:var(--accent)}
    .book{padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:18px}.book .meta{color:var(--muted);text-align:right;white-space:nowrap}.book-left{display:flex;gap:12px;align-items:flex-start;min-width:0}.book-cover{width:48px;height:72px;object-fit:cover;background:var(--line);border:1px solid var(--line);flex:0 0 auto}.book-cover.missing{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.7rem;text-align:center}.book-info{min-width:0}.book small{display:block;color:var(--muted);margin-top:3px}.book details{margin-top:8px}.book summary{color:var(--accent);cursor:pointer;font-size:.85rem}
    .edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.edit-grid label{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:.75rem}.edit-grid input,.edit-grid select,.edit-grid textarea{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px}.edit-grid textarea{min-height:54px;resize:vertical;grid-column:1/-1}.edit-actions{display:flex;gap:8px;margin-top:8px}.edit-message{color:var(--muted);font-size:.8rem}.muted{color:var(--muted)}
    @media(max-width:640px){.book .meta{white-space:normal}.edit-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>Folio <span class="noo">Nooir</span></h1><nav><a href="/">Device</a><a href="/library">Bookshelf</a><a class="active" href="/stats">Reading Stats</a><a href="/files">Transfer</a><a href="/settings">Settings</a><a href="/fonts">Typography</a></nav></header>
  <main><div class="cards" id="summary"><div class="card">Loading statistics...</div></div><h2>Reading Calendar</h2><p class="muted">Each filled day represents a saved reading session. Unknown-date sessions are shown separately until the device clock is synchronized.</p><section class="calendar" id="calendar"></section><div class="toolbar"><h2 style="margin:0;flex:1">Book Details</h2><a class="button" href="/api/stats/export">Download JSON</a></div><section id="books"></section></main>
  <script>
    const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const duration=s=>s<60?`${s}s`:s<3600?`${Math.floor(s/60)}m`:`${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`;
    const dateKey=n=>n?String(n).padStart(8,'0').replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3'):'Unknown';
    const dateInput=n=>n?dateKey(n):'';const dateNumber=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?Number(m[1]+m[2]+m[3]):0};
    const statusName=['New','Reading','On hold','Finished'];const cover=b=>b.coverIndex>=0?`<img class="book-cover" loading="lazy" src="/api/library/cover?index=${b.coverIndex}" alt=""/>`:'<div class="book-cover missing">No cover</div>';
    const saveBook=async(path,form,msg)=>{const payload={path,title:form.querySelector('[name=title]').value,author:form.querySelector('[name=author]').value,synopsis:form.querySelector('[name=synopsis]').value,status:Number(form.querySelector('[name=status]').value),progress:Number(form.querySelector('[name=progress]').value),startDate:dateNumber(form.querySelector('[name=startDate]').value),finishDate:dateNumber(form.querySelector('[name=finishDate]').value)};msg.textContent='Saving...';try{const r=await fetch('/api/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||'Save failed');msg.textContent='Saved';setTimeout(load,350)}catch(e){msg.textContent=e.message}};
    const resetBook=async(path,msg)=>{if(!confirm('Reset reading data for this book?'))return;msg.textContent='Resetting...';try{const r=await fetch('/api/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path,action:'reset'})});const d=await r.json();if(!r.ok)throw Error(d.error||'Reset failed');msg.textContent='Reset';setTimeout(load,350)}catch(e){msg.textContent=e.message}};
    function load(){return fetch('/api/stats').then(r=>r.json()).then(data=>{document.getElementById('summary').innerHTML=`<div class="card"><div class="label">Total reading</div><div class="value">${duration(data.totalSeconds)}</div></div><div class="card"><div class="label">Sessions</div><div class="value">${data.sessions}</div></div><div class="card"><div class="label">Today</div><div class="value">${data.today?duration(data.todaySeconds):'Sync clock'}</div></div>`;const days=[...(data.days||[])],max=days.reduce((m,d)=>Math.max(m,d.seconds),1);document.getElementById('calendar').innerHTML=days.length?days.map(d=>`<div class="day ${d.seconds?'read':''}" style="opacity:${d.seconds?(.45+.55*d.seconds/max):.45}"><b>${dateKey(d.date)}</b><small>${duration(d.seconds)} &middot; ${d.sessions} session${d.sessions==1?'':'s'}</small></div>`).join(''):'<div class="muted">No completed sessions yet.</div>';
      document.getElementById('books').innerHTML=(data.books||[]).length?data.books.map(b=>`<div class="book"><div class="book-left">${cover(b)}<div class="book-info"><b>${esc(b.title||b.path)}</b>${b.author?`<small>${esc(b.author)}</small>`:''}<details><summary>Edit book</summary><form class="edit-grid" data-path="${esc(b.path)}"><label>Title<input name="title" value="${esc(b.title||'')}"></label><label>Author<input name="author" value="${esc(b.author||'')}"></label><label>Status<select name="status">${statusName.map((s,n)=>`<option value="${n}" ${n===b.status?'selected':''}>${s}</option>`).join('')}</select></label><label>Progress %<input name="progress" type="number" min="0" max="100" value="${b.progress||0}"></label><label>Started<input name="startDate" type="date" value="${dateInput(b.startDate)}"></label><label>Finished<input name="finishDate" type="date" value="${dateInput(b.finishDate)}"></label><label>Synopsis<textarea name="synopsis">${esc(b.synopsis||'')}</textarea></label><div class="edit-actions"><button type="submit">Save</button><button type="button" class="reset">Reset reading data</button><span class="edit-message"></span></div></form></details></div></div><span class="meta">${statusName[b.status]||'New'} &middot; ${b.progress}%<br>${duration(b.seconds)} &middot; ${b.sessions} session${b.sessions==1?'':'s'}</span></div>`).join(''):'<div class="muted">No book statistics yet.</div>';
      document.querySelectorAll('.edit-grid').forEach(form=>{const msg=form.querySelector('.edit-message');form.addEventListener('submit',e=>{e.preventDefault();saveBook(form.dataset.path,form,msg)});form.querySelector('.reset').addEventListener('click',()=>resetBook(form.dataset.path,msg))});}).catch(()=>document.getElementById('summary').textContent='Could not load statistics.')}
    load();
  </script>
</body>
</html>
