[env:gh_release_nooir167_seqble_x4_20261120_04]
extends = env:gh_release_nooir167_seqble_x4_20261119_03
; Official-candidate profile based on the physically tested _04 behavior.
; It retains adaptive EPUB BLE and IINE gesture behavior, but removes noisy diagnostic-only flags and uses a clean 1.6.7 version string.
; This is still an experimental validation build until watchdog/rollback and final-image physical gates pass.
