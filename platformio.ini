build_flags =
  ${env:gh_release_nooir167_seqble_x4_20261120_04.build_flags}
  -DCROSSPOINT_VERSION=\"1.6.7\"
  -UNOOIR_BLE_DIAGNOSTICS
  -UFREEINK_BLE_HID_RAW_DIAGNOSTICS
  -UFREEINK_BLE_HID_REPORT_DEBUG
  -UFREEINK_BLE_HID_LIFECYCLE_DIAGNOSTICS
  -UFREEINK_BLE_NIMBLE_RESOURCE_DIAGNOSTICS
  -UNOOIR_READER_TRANSITION_DIAGNOSTICS
