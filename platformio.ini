[platformio]
default_envs = default
build_cache_dir = .cache/build-20261120_04_fresh
extra_configs = platformio.local.ini

[crosspoint]
version = 1.6.7-exp-x4-sq-1120.4

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
; missingInclude (project headers) is suppressed alongside missingIncludeSystem: on a
; fresh CI checkout cppcheck has no resolved include paths, so it reports every
; project header as missing (~400 information-level lines) and fails the job.
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=missingInclude --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
  -Ifreeink-sdk/libs/book/FreeInkBook/third_party/tjpgd
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
# MEMFIX-PORT: single-precision ECC (sp_c32.c). Without it every P-256 operation
# (TLS 1.3 key_share keygen, ECDHE, ECDSA cert verify) runs on fast-math bignums
# that WOLFSSL_SMALL_STACK heap-allocates at FP_MAX_BITS size -- tens of KB of
# temporaries, which OOMs (MP_MEM) at the ~50KB free heap a reading session
# leaves. SP uses fixed 256-bit arrays: a few KB, and several times faster.
# SP_SMALL trades the large precomputed point tables for smaller flash.
  -DWOLFSSL_HAVE_SP_ECC
  -DWOLFSSL_SP_SMALL
  -DHAVE_TLS_EXTENSIONS
  -DHAVE_SUPPORTED_CURVES
  -DHAVE_HKDF
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DWC_RSA_PSS
  -DHAVE_SNI
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

; MEMFIX-PORT: custom_sdkconfig heap reclamation (~32-37 KB). Rebuilds the
; Arduino core libs on first build (slower once, cached after; needs the CMake
; pin in platformio.local.ini on macOS).
;
; If an interrupted rebuild fails with "multiple definition of 'app_main'"
; (stale generated scaffold), clean it up with:
;   rm -rf .dummy CMakeLists.txt sdkconfig.default sdkconfig.defaults .pio/build/default
; Do NOT use `git clean -fdX` — it deletes platformio.local.ini.
custom_sdkconfig =
  ; Task stack right-sizing from measured high-water marks (heap block map +
  ; per-task stack audit, July 2026): esp_timer used ~0.8 KB of 8 KB across
  ; every capture; the FreeRTOS timer service used ~0.5 KB
  ; of 4 KB. Neither runs TLS or app code. ~7 KB back to the heap.
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  ; Move the WiFi stack's non-critical hot paths out of IRAM into flash.
  ; On the C3, IRAM and DRAM share one SRAM pool, so the ~25-30 KB this
  ; frees lands directly in the heap — paid for with lower WiFi throughput
  ; during transfers (occasional sync/OTA use, not streaming: acceptable).
  ; IRAM cost is static, so the heap gain applies even with WiFi off.
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  ; Keep the Arduino wrappers for the removed cloud components (below) out of
  ; the core source list; all other bundled libraries default to enabled.
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  ; ESP_SR (speech recognition) only exists in the S3 core; its wrapper includes
  ; ESP_I2S.h, which the isolated core rebuild can't resolve. Unused here anyway,
  ; so drop it or the sticky env fails to build.
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
  ; Nooir acts only as a BLE central/client. Scanning is stopped before the
  ; single HID connection is started, and the application never advertises or
  ; exposes a GATT server. One controller activity is therefore sufficient.
  CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=n
  CONFIG_BT_NIMBLE_ROLE_BROADCASTER=n
  CONFIG_BT_NIMBLE_GATT_SERVER=n
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  CONFIG_BT_CTRL_BLE_MAX_ACT=1
  CONFIG_BT_CTRL_BLE_MAX_ACT_EFF=1

; Drop unused cloud components from the core rebuild. esp_insights/rainmaker
; require embedded server certs the lib builder can't generate
; ("https_server.crt.S not found"); this firmware uses none of them.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_schedule
  espressif/esp_rcp_update
  espressif/esp_secure_cert_mgr
  espressif/cbor

extra_scripts =
  pre:scripts/apply_nooir_freeink_patch.py
  pre:scripts/patch_sdfat_alloc_hint.py
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/copy_firmware.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  BleKeyboardHost=symlink://freeink-sdk/libs/network/BleKeyboardHost
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  wolfssl/Arduino-wolfSSL @ 5.7.2

lib_ignore =
  BLE

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DFREEINK_CAP_BLE_HID_HOST=0
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base
lib_deps =
  ${base.lib_deps}
  h2zero/NimBLE-Arduino @ 2.5.1
build_flags =
  ${base.build_flags}
  -DFREEINK_CAP_BLE_HID_HOST=1
  -DNOOIR_BLE_READER_COEXISTENCE=1
  -DFREEINK_BLE_HID_LIFECYCLE_DIAGNOSTICS=1
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

; Hardware diagnostic profile for separating HalStorage lock time from SdFat
; sector I/O, card-ready polling, and buffer-level SPI transfers. This profile
; keeps the gh_release BLE/X4/SDK configuration and adds measurement overhead;
; do not use it as the performance/release binary.
[env:gh_release_sdtrace]
extends = env:gh_release
build_flags =
  ${env:gh_release.build_flags}
  -DNOOIR_SD_SPI_DIAGNOSTICS=1
  -Ilib/hal
  -fstack-usage
extra_scripts =
  ${base.extra_scripts}
  pre:scripts/patch_sdfat_sd_diagnostics.py

; BLE-enabled experimental candidate for the shared original-X3/original-X4
; SdFat array-transfer path. Runtime device detection and the existing
; per-device board profiles still select pins, clocks, panel and SD power.
; gh_release remains the byte-mode fallback. -fstack-usage records static frames.
[env:gh_release_spiarray]
extends = env:gh_release
build_flags =
  ${env:gh_release.build_flags}
  -DUSE_SPI_ARRAY_TRANSFER=1
  -Ilib/hal
  -fstack-usage
extra_scripts =
  ${base.extra_scripts}
  pre:scripts/patch_sdfat_spi_array_transfer.py

; Instrumented counterpart for comparable byte-SPI vs array-SPI X4 runs.
[env:gh_release_spiarray_sdtrace]
extends = env:gh_release_sdtrace
build_flags =
  ${env:gh_release_sdtrace.build_flags}
  -DUSE_SPI_ARRAY_TRANSFER=1
extra_scripts =
  ${env:gh_release_sdtrace.extra_scripts}
  pre:scripts/patch_sdfat_spi_array_transfer.py

[env:gh_release_epubdiag]
extends = env:gh_release
build_flags =
  ${env:gh_release.build_flags}
  -DNOOIR_EPUB_DIAGNOSTICS=1

[env:gh_release_syncfontdiag]
extends = env:gh_release
build_flags =
  ${env:gh_release.build_flags}
  -DNOOIR_KOSYNC_FONT_DIAGNOSTICS=1
  -DNOOIR_SD_FONT_DIAGNOSTICS=1

[env:gh_release_diag]
extends = env:gh_release
build_flags =
  ${env:gh_release.build_flags}
  -DNOOIR_EPUB_DIAGNOSTICS=1
  -DNOOIR_KOSYNC_FONT_DIAGNOSTICS=1
  -DNOOIR_SD_FONT_DIAGNOSTICS=1

; Developer-only BLE diagnostics profile. The user-facing release is gh_release;
; this environment adds bounded diagnostics and is not required for BLE use.
[env:ble_experimental]
extends = env:gh_release
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DFREEINK_CAP_BLE_HID_HOST=1
  -DNOOIR_BLE_READER_COEXISTENCE=1
  -DFREEINK_BLE_HID_LIFECYCLE_DIAGNOSTICS=1
  -DNOOIR_BLE_DIAGNOSTICS=1
  -DFREEINK_BLE_HID_RAW_DIAGNOSTICS=1
  -DNOOIR_EPUB_DIAGNOSTICS=1
  -DNOOIR_KOSYNC_FONT_DIAGNOSTICS=1
  -DNOOIR_SD_FONT_DIAGNOSTICS=1
  -DNOOIR_INTERFACE_FONT_DIAGNOSTICS=1

; Narrow BLE resource/Reader-transition diagnostics for one controlled X4 run.
; Regular gh_release and the byte/array storage profiles compile these probes out.
[env:gh_release_ble_resourcediag]
extends = env:gh_release
build_flags =
  ${env:gh_release.build_flags}
  -DFREEINK_BLE_NIMBLE_RESOURCE_DIAGNOSTICS=1
  -DNOOIR_READER_TRANSITION_DIAGNOSTICS=1

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; --- Seeed Sticky — ESP32-S3R8, 3.97" 800x480 SSD1677 + GT911 touch -----------
; Different MCU family than the C3 envs (one binary per family). The SDK
; auto-enables CAP_TOUCH (GT911) and the BQ27220 gauge for this device; PSRAM is
; intentionally left off (48KB framebuffer fits in DRAM, same as X4).
;   pio run -e sticky -t upload
[env:sticky]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  ; git_branch.py only injects CROSSPOINT_VERSION for the default env; set it here.
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-sticky\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2

; --- Native X4 simulator ----------------------------------------------------
; This environment deliberately does not extend [base]: the ESP32 platform,
; Arduino core, physical FreeInk drivers, OTA code, and device-only build
; scripts are replaced by the host compatibility layer supplied by the pinned
; CrossPoint simulator dependency. The application sources and ActivityManager
; remain the same as the device build. The dependency is pinned separately from
; the Nooir firmware version so simulator infrastructure can move without
; changing the physical firmware identity.
[env:simulator_x4]
platform = native
lib_ldf_mode = deep+
lib_compat_mode = off
build_src_filter =
  +<*>
  -<network/FirmwareFlasher.cpp>
  -<network/OtaUpdater.cpp>
  -<network/OtaBootSwitch.cpp>
  -<platform/skip_efuse_blk_check.c>
  -<platform/wolfssl_max_fragment.cpp>
build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  -lssl
  -lcrypto
  -Wno-deprecated-declarations
  -Wno-narrowing
  -DSIMULATOR
  -DCROSSPOINT_EMULATED=1
  -DFREEINK_DEVICE_X4=1
  -DCROSSPOINT_SIMULATOR_PROJECT_WEBSERVER
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -Ifreeink-sdk/libs/book/FreeInkBook/third_party/tjpgd
  -Isrc
  -Isimulator_compat
  -include simulator_compat/HostPlatform.h
build_unflags =
  -std=gnu++11
lib_ignore =
  hal
  BatteryMonitor
  InputManager
  EInkDisplay
  SDCardManager
  BoardConfig
  XteinkDetect
  PowerManager
  Rtc
  Imu
  SecureNet
  BLE
  PNGdec
  JPEGDEC
  WebSockets
  wolfSSL
custom_run_simulator_target_owner = project
extra_scripts =
  pre:scripts/gen_i18n.py
  pre:scripts/build_html.py
  pre:scripts/simulator_board_config.py
  pre:scripts/simulator_hal_clock.py
  pre:scripts/simulator_png_compat.py
  pre:scripts/simulator_string_compat.py
  ; The simulator library owns the launcher. This project-side hook exposes
  ; the same target in PlatformIO's IDE task list without double-registering it.
  post:.pio/libdeps/$PIOENV/simulator/run_simulator_project.py
lib_deps =
  simulator=https://github.com/crosspoint-reader/crosspoint-simulator.git#2b5806df5fbf07389c182540faa7efcf0b2c5b44
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  BleKeyboardHost=symlink://freeink-sdk/libs/network/BleKeyboardHost
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1

; X3 profile uses the same native simulator foundation with the upstream
; 792x528 X3 board/controller/input profile selected at compile time.
[env:simulator_x3]
extends = env:simulator_x4
build_flags =
  ${env:simulator_x4.build_flags}
  -DSIMULATOR_DEVICE_X3
  -DFREEINK_DEVICE_X3=1
extra_scripts =
  ${env:simulator_x4.extra_scripts}
  pre:scripts/simulator_x3_tilt.py

; Isolated BLE/Reader diagnostic profile: preserves shared SPI-array hooks and adds telemetry defines only.
[env:gh_release_spiarray_ble_resourcediag_02]
extends = env:gh_release_spiarray
build_flags =
  ${env:gh_release_spiarray.build_flags}
  -DFREEINK_BLE_NIMBLE_RESOURCE_DIAGNOSTICS=1
  -DNOOIR_READER_TRANSITION_DIAGNOSTICS=1

; EPUB-only staged admission experiment. The resourcediag profile above is the
; unchanged conservative book-peak comparison baseline.
[env:gh_release_spiarray_ble_epub_pageaware_20261106_01]
extends = env:gh_release_spiarray_ble_resourcediag_02
build_flags =
  ${env:gh_release_spiarray_ble_resourcediag_02.build_flags}
  -DNOOIR_EPUB_BLE_PAGE_AWARE_EXPERIMENT=1

; Isolated X4 HID report capture using the same SPI-array and EPUB page-aware
; source as the preserved experiment. Raw reports are bounded and serialized
; outside the BLE callback; this profile is diagnostic-only, not a release image.
[env:gh_release_spiarray_ble_epub_hidraw_20261111_01]
extends = env:gh_release_spiarray_ble_epub_pageaware_20261106_01
build_flags =
  ${env:gh_release_spiarray_ble_epub_pageaware_20261106_01.build_flags}
  -DNOOIR_BLE_DIAGNOSTICS=1
  -DFREEINK_BLE_HID_RAW_DIAGNOSTICS=1
  -DFREEINK_BLE_HID_REPORT_DEBUG=1

; IINE Touch Mode gesture normalization experiment. Generic HID decoding, BLE
; admission, Reader thresholds, caches and persistence remain unchanged.
[env:gh_release_spiarray_ble_epub_iinegestures_20261111_01]
extends = env:gh_release_spiarray_ble_epub_pageaware_20261106_01
build_flags =
  ${env:gh_release_spiarray_ble_epub_pageaware_20261106_01.build_flags}
  -DNOOIR_BLE_DIAGNOSTICS=1
  -DFREEINK_BLE_HID_RAW_DIAGNOSTICS=1
  -DNOOIR_BLE_IINE_TOUCH_GESTURES=1

; Unique integrated original-X4 experimental candidate. This inherits the
; verified EB4D SPI-array/BLE/IINE flags; build outputs land in a distinct
; PlatformIO environment directory.
[env:gh_release_nooir167_integrated_x4_20261118_02]
extends = env:gh_release_spiarray_ble_epub_iinegestures_20261111_01
build_flags =
  ${env:gh_release_spiarray_ble_epub_iinegestures_20261111_01.build_flags}

; Compile-gated sequential EPUB/BLE experiment. It preserves the integrated
; X4/SPI-array inputs and activates automatically at a stable EPUB page only
; when Bluetooth is enabled. It is not a production memory-policy change.
[env:gh_release_nooir167_idleble_diag_20261119_01]
extends = env:gh_release_nooir167_integrated_x4_20261118_02
build_flags =
  ${env:gh_release_nooir167_integrated_x4_20261118_02.build_flags}
  -DNOOIR_EPUB_BLE_IDLE_ADMISSION_DIAGNOSTIC=1

; Isolated allocation-lifetime tracing build for Home/BLE/Reader heap ownership.
; Heap hooks add a diagnostic-only call on allocator events and reserve fixed BSS
; buffers. Do not use this image for performance comparisons or release builds.
[env:gh_release_spiarray_ble_heaptrace_20261105_01]
extends = env:gh_release_spiarray_ble_resourcediag_02
build_flags =
  ${env:gh_release_spiarray_ble_resourcediag_02.build_flags}
  -DNOOIR_HEAP_LIFETIME_TRACE=1
  -Wl,--wrap=esp_bt_controller_init
  -Wl,--wrap=esp_bt_controller_deinit
custom_sdkconfig =
  ${env:gh_release_spiarray_ble_resourcediag_02.custom_sdkconfig}
  CONFIG_HEAP_USE_HOOKS=y

; Follow-up build with allocator-rounded block sizes sampled at safe checkpoints.
[env:gh_release_spiarray_ble_heaptrace_20261105_02]
extends = env:gh_release_spiarray_ble_resourcediag_02
build_flags =
  ${env:gh_release_spiarray_ble_resourcediag_02.build_flags}
  -DNOOIR_HEAP_LIFETIME_TRACE=1
  -Wl,--wrap=esp_bt_controller_init
  -Wl,--wrap=esp_bt_controller_deinit
custom_sdkconfig =
  ${env:gh_release_spiarray_ble_resourcediag_02.custom_sdkconfig}
  CONFIG_HEAP_USE_HOOKS=y

; Isolated same-source comparison outputs for the XTC Home cleanup experiment.
[env:hrx_base]
extends = env:gh_release_spiarray_ble_resourcediag_02

[env:hrx_fix]
extends = env:gh_release_spiarray_ble_resourcediag_02

[env:hrx_base_seed02]
extends = env:gh_release_spiarray_ble_resourcediag_02

[env:gh_release_nooir167_seqble_x4_20261119_02]
extends = env:gh_release_nooir167_integrated_x4_20261118_02
build_flags =
  ${env:gh_release_nooir167_integrated_x4_20261118_02.build_flags}
  -DNOOIR_EPUB_BLE_IDLE_ADMISSION_DIAGNOSTIC=1

; Isolated _03 candidate. Same feature flags as _02; unique output identity.
[env:gh_release_nooir167_seqble_x4_20261119_03]
extends = env:gh_release_nooir167_integrated_x4_20261118_02
